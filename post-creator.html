<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MCC Post Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px 12px 110px;
    font: 16px/1.4 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f4f6f8; color: #1a2332;
  }
  h1 { margin: 4px 0 12px; font-size: 18px; font-weight: 700; }
  .controls {
    display: grid; gap: 10px; grid-template-columns: 1fr 1fr;
    background: #fff; padding: 14px; border-radius: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,.06); margin-bottom: 14px;
  }
  .controls label { font-size: 11px; font-weight: 700; color: #5a6678; text-transform: uppercase; letter-spacing: .5px; }
  .controls select, .controls input[type="file"] {
    width: 100%; padding: 9px; border: 1px solid #d9dee6;
    border-radius: 9px; font-size: 14px; background: #fff;
    font-family: inherit;
  }
  .full { grid-column: 1 / -1; }
  .bg-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .bg-presets button {
    flex: 1; min-width: 56px; padding: 10px 6px; border: 2px solid transparent;
    border-radius: 9px; cursor: pointer; font-size: 11px; font-weight: 700;
    color: #fff; min-height: 42px; font-family: inherit; letter-spacing: .5px;
  }
  .bg-presets button.active { border-color: #1a2332; box-shadow: 0 0 0 2px #fff inset; }
  .bg-presets .bg-blue   { background: #14315c; }
  .bg-presets .bg-navy   { background: linear-gradient(180deg,#0a1d3a 0%,#14315c 100%); }
  .bg-presets .bg-gold   { background: linear-gradient(135deg,#14315c 0%,#c9a227 100%); }
  .bg-presets .bg-black  { background: #0d0d0d; }
  .bg-presets .bg-white  { background: #fff; color: #1a2332; border: 2px solid #d9dee6; }

  .canvas-wrap {
    width: 100%; overflow: hidden;
    display: flex; justify-content: center;
    margin-bottom: 14px;
    border-radius: 12px;
  }
  .canvas {
    width: 1080px; height: 1080px;
    transform-origin: top left;
    position: relative;
    color: #fff; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #14315c;
    display: flex; flex-direction: column;
  }
  .canvas.portrait { height: 1350px; }
  .canvas.story    { height: 1920px; }
  .canvas.theme-white { color: #1a2332; }

  /* Photo background overlay */
  .canvas .bg-photo {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    z-index: 0;
  }
  .canvas .bg-overlay {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg,
      rgba(10,29,58,0) 0%,
      rgba(10,29,58,.15) 35%,
      rgba(10,29,58,.55) 70%,
      rgba(10,29,58,.88) 100%);
    pointer-events: none;
  }
  .canvas:not(.has-photo) .bg-photo,
  .canvas:not(.has-photo) .bg-overlay { display: none; }

  /* Layout layer (above background) */
  .canvas .layer {
    position: relative; z-index: 2;
    flex: 1; display: flex; flex-direction: column;
  }

  /* Brand mark (top) */
  .brand-mark {
    display: flex; align-items: center; gap: 18px;
    padding: 50px 60px 0;
  }
  .brand-mark img {
    width: 100px; height: 100px; object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,.35));
  }
  .brand-mark .name {
    font-size: 32px; font-weight: 800; letter-spacing: 2px;
    text-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .canvas.story .brand-mark { padding: 80px 60px 0; }
  .canvas.story .brand-mark img { width: 130px; height: 130px; }
  .canvas.story .brand-mark .name { font-size: 40px; }

  /* Editable text block */
  .text-block {
    flex: 1; padding: 40px 60px;
    display: flex; flex-direction: column; justify-content: flex-end;
    gap: 18px;
  }
  .title-edit {
    font-size: 96px; font-weight: 900; line-height: 1;
    letter-spacing: -1px;
    outline: none;
    text-shadow: 0 4px 18px rgba(0,0,0,.45);
  }
  .canvas.story .title-edit { font-size: 124px; }
  .body-edit {
    font-size: 42px; font-weight: 500; line-height: 1.3;
    outline: none;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
    opacity: .96;
  }
  .canvas.story .body-edit { font-size: 52px; }

  /* Sponsor strip (bottom) */
  .sponsor-band {
    background: rgba(255,255,255,.94);
    padding: 26px 50px 22px;
    display: flex; flex-direction: column; gap: 14px;
    color: #1a2332;
  }
  .sponsor-band .label {
    font-size: 16px; font-weight: 800; letter-spacing: 3px;
    color: #5a6678; text-align: center;
  }
  .sponsor-row {
    display: flex; align-items: center; justify-content: center;
    gap: 28px; flex-wrap: nowrap;
  }
  .sponsor-row img { object-fit: contain; }
  .s-gold {
    height: 110px; max-width: 32%;
    filter: drop-shadow(0 0 10px rgba(201,162,39,.35));
  }
  .s-silver { height: 60px; max-width: 14%; opacity: .92; }
  .s-bronze { height: 52px; max-width: 13%; opacity: .88; }
  .canvas.story .s-gold   { height: 140px; }
  .canvas.story .s-silver { height: 80px; }
  .canvas.story .s-bronze { height: 68px; }
  .tier-divider {
    width: 1px; height: 50px; background: rgba(0,0,0,.12);
    flex-shrink: 0;
  }
  .canvas.story .tier-divider { height: 70px; }
  .sponsor-handle {
    text-align: center; font-size: 18px; font-weight: 600;
    color: #5a6678; letter-spacing: .5px; padding-top: 4px;
  }

  /* Action bar (fixed bottom) */
  .actions {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #fff; padding: 12px;
    box-shadow: 0 -2px 10px rgba(0,0,0,.08);
    display: flex; gap: 8px;
  }
  .actions button {
    flex: 1; padding: 14px; border: none; border-radius: 11px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    background: #14315c; color: #fff; font-family: inherit;
  }
  .actions button.secondary { background: #f4f6f8; color: #1a2332; border: 1px solid #d9dee6; }
  .actions button:disabled { opacity: .6; }

  .preview-modal {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.9); z-index: 100;
    padding: 16px; overflow: auto;
  }
  .preview-modal.show { display: block; }
  .preview-modal .modal-inner {
    max-width: 600px; margin: 0 auto;
    display: flex; flex-direction: column; gap: 12px;
  }
  .preview-modal img { width: 100%; height: auto; border-radius: 8px; background: #fff; }
  .preview-modal .hint { color: #fff; font-size: 14px; text-align: center; padding: 8px; line-height: 1.5; }
  .preview-modal a.dl-btn {
    display: block; padding: 14px; background: #14315c; color: #fff;
    text-align: center; text-decoration: none; border-radius: 11px;
    font-weight: 700;
  }
  .preview-modal button.close-btn {
    padding: 12px; background: #fff; color: #1a2332;
    border: none; border-radius: 11px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<h1>MCC Post Creator</h1>

<div class="controls">
  <div>
    <label for="format">Format</label>
    <select id="format">
      <option value="square">Square — feed</option>
      <option value="portrait">Portrait — feed</option>
      <option value="story">Story / Reel</option>
    </select>
  </div>
  <div>
    <label for="photo">Photo (optional)</label>
    <input type="file" id="photo" accept="image/*">
  </div>
  <div class="full">
    <label>Background (when no photo)</label>
    <div class="bg-presets" id="bg-presets">
      <button class="bg-blue active" data-bg="blue">Blue</button>
      <button class="bg-navy" data-bg="navy">Navy</button>
      <button class="bg-gold" data-bg="gold">Gold</button>
      <button class="bg-black" data-bg="black">Black</button>
      <button class="bg-white" data-bg="white">White</button>
    </div>
  </div>
</div>

<div class="canvas-wrap">
  <div class="canvas" id="canvas">
    <div class="bg-photo" id="bg-photo"></div>
    <div class="bg-overlay"></div>
    <div class="layer">
      <div class="brand-mark">
        <img src="post-assets/mcc-logo.png" alt="MCC">
        <div class="name">MILTON CRICKET CHAMPS</div>
      </div>
      <div class="text-block">
        <div class="title-edit" contenteditable="true" data-placeholder="YOUR HEADLINE">YOUR HEADLINE</div>
        <div class="body-edit" contenteditable="true" data-placeholder="Tap to edit. Add date, venue, details.">Tap to edit. Add date, venue, details.</div>
      </div>
      <div class="sponsor-band">
        <div class="label">PROUDLY SPONSORED BY</div>
        <div class="sponsor-row">
          <img class="s-gold"   src="post-assets/sponsor-darpan.png"    alt="Darpan Patel">
          <div class="tier-divider"></div>
          <img class="s-silver" src="post-assets/sponsor-wecare.png"    alt="We Care Rehab">
          <img class="s-silver" src="post-assets/sponsor-chirag.png"    alt="Chirag Chauhan">
          <img class="s-silver" src="post-assets/sponsor-pacific.png"   alt="Pacific Tutorials">
          <div class="tier-divider"></div>
          <img class="s-bronze" src="post-assets/sponsor-sivaselvi.png" alt="Sivaselvi Duraisamy">
        </div>
        <div class="sponsor-handle">@miltoncricketchamps · miltoncricketchamps.ca</div>
      </div>
    </div>
  </div>
</div>

<div class="actions">
  <button class="secondary" id="reset">Reset</button>
  <button id="render">Generate PNG</button>
</div>

<div class="preview-modal" id="modal">
  <div class="modal-inner">
    <div class="hint">Long-press the image → <b>Save to Photos</b> (iPhone)<br>or tap <b>Download</b> below (Android)</div>
    <img id="preview" alt="Generated post">
    <a class="dl-btn" id="dl" download="mcc-post.png" href="#">Download</a>
    <button class="close-btn" id="close">Close</button>
  </div>
</div>

<script>
const canvas    = document.getElementById('canvas');
const formatEl  = document.getElementById('format');
const photoEl   = document.getElementById('photo');
const bgPhotoEl = document.getElementById('bg-photo');
const bgRow     = document.getElementById('bg-presets');
const renderBtn = document.getElementById('render');
const resetBtn  = document.getElementById('reset');
const modal     = document.getElementById('modal');
const preview   = document.getElementById('preview');
const dl        = document.getElementById('dl');
const closeBtn  = document.getElementById('close');
const wrap      = document.querySelector('.canvas-wrap');

const BG = {
  blue:  { css: '#14315c',                                          theme: 'dark'  },
  navy:  { css: 'linear-gradient(180deg,#0a1d3a 0%,#14315c 100%)',  theme: 'dark'  },
  gold:  { css: 'linear-gradient(135deg,#14315c 0%,#c9a227 100%)',  theme: 'dark'  },
  black: { css: '#0d0d0d',                                          theme: 'dark'  },
  white: { css: '#ffffff',                                          theme: 'white' }
};

function applyBg(name) {
  const b = BG[name];
  canvas.style.background = b.css;
  canvas.classList.toggle('theme-white', b.theme === 'white');
  bgRow.querySelectorAll('button').forEach(btn => btn.classList.toggle('active', btn.dataset.bg === name));
}

function applyFormat() {
  canvas.classList.remove('square','portrait','story');
  canvas.classList.add(formatEl.value);
  fitScale();
}

function fitScale() {
  const target = wrap.clientWidth;
  const scale = target / 1080;
  canvas.style.transform = `scale(${scale})`;
  const h = formatEl.value === 'story' ? 1920 : (formatEl.value === 'portrait' ? 1350 : 1080);
  wrap.style.height = (h * scale) + 'px';
}

photoEl.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    bgPhotoEl.style.backgroundImage = `url(${ev.target.result})`;
    canvas.classList.add('has-photo');
  };
  reader.readAsDataURL(f);
});

bgRow.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b && b.dataset.bg) applyBg(b.dataset.bg);
});

formatEl.addEventListener('change', applyFormat);
window.addEventListener('resize', fitScale);

resetBtn.addEventListener('click', () => {
  if (!confirm('Reset all text and photo?')) return;
  canvas.querySelector('.title-edit').textContent = 'YOUR HEADLINE';
  canvas.querySelector('.body-edit').textContent  = 'Tap to edit. Add date, venue, details.';
  bgPhotoEl.style.backgroundImage = '';
  canvas.classList.remove('has-photo');
  photoEl.value = '';
  formatEl.value = 'square';
  applyFormat();
  applyBg('blue');
});

renderBtn.addEventListener('click', async () => {
  renderBtn.disabled = true; renderBtn.textContent = 'Generating…';
  try {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const prevTransform = canvas.style.transform;
    canvas.style.transform = 'none';
    // Render at 2x for crisp output
    const png = await html2canvas(canvas, {
      useCORS: true, allowTaint: false,
      backgroundColor: null, scale: 2,
      logging: false, imageTimeout: 30000,
      windowWidth: 1080,
      windowHeight: canvas.offsetHeight
    });
    canvas.style.transform = prevTransform;

    const dataUrl = png.toDataURL('image/png');
    preview.src = dataUrl;
    dl.href = dataUrl;
    const stamp = new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
    dl.download = `mcc-post-${stamp}.png`;
    modal.classList.add('show');
  } catch (err) {
    alert('Render failed: ' + err.message);
  } finally {
    renderBtn.disabled = false; renderBtn.textContent = 'Generate PNG';
  }
});

closeBtn.addEventListener('click', () => modal.classList.remove('show'));

document.querySelectorAll('[contenteditable]').forEach(el => {
  el.addEventListener('focus', () => {
    if (el.textContent === el.dataset.placeholder) el.textContent = '';
  });
  el.addEventListener('blur', () => {
    if (!el.textContent.trim()) el.textContent = el.dataset.placeholder || '';
  });
});

applyBg('blue');
applyFormat();
</script>
</body>
</html>
